# Hanzo Cloud build/deploy manifest — hanzo-apps/hanzo-starter
#
# A forked app is a STATIC SPA: Vite builds `dist/`, Hanzo Cloud serves it at
# `<slug>.hanzo.app` from the project's object-storage prefix (the `*.hanzo.app`
# published-sites edge). There is no server process — identity + data are done
# in the browser (Hanzo IAM PKCE -> IAM token -> Hanzo Base).
build:
  runtime: static
  install: npm ci
  command: npm run build
  output: dist
  # Serve index.html for client routes (the /auth/callback PKCE return leg).
  spa: true

# The Base data plane provisioned on publish. Hanzo Cloud reads this DDL and
# runs `provisionBaseFromDDL` (creates the collections, org-scoped, IAM-native).
data:
  base: true
  schema: schema.sql

# Injected into the build as import.meta.env.* (see .env.example / README).
# The deploy pipeline overrides these per publish: VITE_HANZO_BASE_URL with the
# provisioned Base URL, and VITE_HANZO_CLIENT_ID with this fork's OWN IAM client
# `<org>-app-<slug>` — which Hanzo Cloud provisions at publish with the EXACT
# redirect https://<slug>.hanzo.app/auth/callback (never a *.hanzo.app wildcard on
# a shared client — that is a token-theft surface). The `hanzo-app` value below is
# only a fail-closed fallback for local dev: the shared client has no
# <slug>.hanzo.app redirect, so an un-overridden publish simply can't sign in
# (it never leaks a code to the wrong app).
env:
  VITE_HANZO_IAM_URL: https://hanzo.id
  VITE_HANZO_CLIENT_ID: hanzo-app
  VITE_HANZO_BASE_URL: https://api.hanzo.ai
